# La verifica delle fonti: settimanale, e una volta al mese va anche a cercarne
# di nuove per i temi rimasti scoperti.
#
# È il terzo anello, e sta fuori dalla corsa delle 08:00 apposta. `nuvola.yml`
# deve restare corta e prevedibile: legge le fonti che trova accese e non
# discute. Qui invece si scarica ogni feed, si aprono tre articoli per fonte per
# cercare il muro di pagamento e si leggono le pagine dei termini — un'ora di
# rete per cinquantasette fonti, che dentro la corsa quotidiana sarebbe una
# rassegna persa ogni mattina.
#
# Gira il lunedì alle 04:00 UTC: prima di tutti e tre i cron di `nuvola.yml`
# (06:00, 07:00 e 14:00), qualunque sia il fuso dell'utente quella settimana.
# Così la corsa del lunedì mattina legge già le fonti riparate.
name: fonti

on:
  schedule:
    - cron: "0 4 * * 1"    # settimanale: verifica e riparazione
    - cron: "0 3 1 * *"    # mensile: scouting per i temi senza nessuna fonte
  workflow_dispatch:
    inputs:
      applica:
        description: "no = marcia a secco, non scrive niente. Di norma si lascia si."
        default: "si"
      scouting:
        description: "no | scoperti | tutti — cercare fonti nuove adesso invece di aspettare il primo del mese."
        default: "no"

# `verifica_fonti.py` non scrive in `percorso.articoli` né tocca `stato.tar`, ma
# `applica_fonti` cambia proprio la tabella che `nuvola.yml` sta leggendo: due
# corse in parallelo e la rassegna legge una lista a metà strada.
concurrency:
  group: rassegna
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fonti:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      # L'unica dipendenza di terze parti di tutto il progetto, e vive solo qui.
      # `feedparser` serve a `fonti_core.feed()`; la conduttura delle 08:00 non
      # lo usa e continua a girare con python3 nudo.
      - name: feedparser
        run: pip install --quiet feedparser

      # La cartella di lavoro DEVE sopravvivere fra una corsa e l'altra: dentro
      # ci sono `estado_verifica.json` (quante corse di fila una fonte ha
      # fallito, e quante erano accettate la volta scorsa) e
      # `programma_fonti.json` (quanti disyuntori di fila). Senza, l'interruttore
      # di crollo non ha con cosa confrontare e non scatta mai — cioè una
      # protezione che sembra esserci e non c'è.
      - name: Stato precedente della verifica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p lavoro-fonti
          if gh release download fonti --repo "$GITHUB_REPOSITORY" \
               --pattern "stato-fonti.tar" --dir . 2>/dev/null; then
            tar -xf stato-fonti.tar
            echo "Ripreso lo stato: $(ls lavoro-fonti | tr '\n' ' ')"
          else
            echo "Prima corsa: nessuno stato precedente. L'interruttore di crollo"
            echo "non avrà un confronto questa volta, e va bene: lo avrà dalla prossima."
          fi

      # Applica per difetto, e non c'è un interruttore da girare a mano.
      # Un cancello qui dentro sarebbe proprio la cosa che, dal 2 ottobre in
      # poi, lascia il sistema fermo senza che nessuno lo sappia: la rete non
      # c'è, dal telefono non si aprono le Actions, e una fonte che muore
      # resta morta fino a novembre.
      #
      # Ciò che protegge non è un permesso, sono i due interruttori che
      # misurano da soli se questa corsa è credibile: 40% di guasti di rete, o
      # le accettate che crollano di oltre la metà rispetto alla volta prima.
      # In entrambi i casi non si scrive una riga.
      #
      # `applica: no` resta a mano, per guardare senza toccare.
      - name: Verifica e applicazione
        id: verifica
        env:
          SUPABASE_CHIAVE: ${{ secrets.SUPABASE_CHIAVE }}
          APPLICA: ${{ github.event.inputs.applica || 'si' }}
        run: |
          set -euo pipefail
          secco=()
          if [ "$APPLICA" != "si" ]; then
            secco=(--senza-applicare)
            echo "Marcia a secco chiesta a mano: nessuna scrittura."
          fi
          # `--da-nuvola` e non il file: `fonti_v4.sql` è la semenza, già
          # applicata una volta; la verità è la tabella. Se questa riga leggesse
          # il file, le candidate che lo scouting propone ogni mese non
          # verrebbero mai verificate — resterebbero spente per sempre, e la
          # lista smetterebbe di migliorare senza che si veda.
          python3 consegna_code/programma_fonti.py --da-nuvola \
            --lavoro lavoro-fonti "${secco[@]}"

      # Solo il primo del mese. Il programmatore lancia già lo scouting quando la
      # verifica esce con 2, cioè quando un tema resta senza fonti: questo passo
      # serve al caso opposto, quello in cui nessun tema è scoperto ma la lista
      # invecchia lo stesso. `proponer.sql` esce con attiva=false e peso 0.3:
      # nessuna fonte si accende senza passare da `verifica_fonti.py`.
      # Si lancia anche a mano, e non è una comodità: il cron mensile cade il
      # primo del mese, cioè il giorno della scadenza. Le fonti nuove di una
      # corsa del primo ottobre si accenderebbero il lunedì dopo, a viaggio
      # iniziato e senza rete per accorgersene. Con `scouting: tutti` si cerca
      # adesso e la verifica del lunedì le accende in tempo.
      #
      # Quello che NON cambia: le candidate entrano comunque spente, con peso
      # 0.3, e nessuna si accende senza passare da `verifica_fonti.py`. Questo
      # passo propone, non decide.
      - name: Scouting
        if: github.event.schedule == '0 3 1 * *' || (github.event.inputs.scouting || 'no') != 'no'
        continue-on-error: true
        # La prima pasada ancha tardó 59,4 minutos con un tope de 60: pasó por
        # treinta y seis segundos. Con los términos en cuatro lenguas son 340
        # preguntas al catálogo en vez de 136, y un tope rozado no es un tope.
        # La verificación de 160 fuentes son unos 38 minutos (medidos: 14,6 con
        # 62), así que 90 caben de sobra en los 150 del trabajo.
        timeout-minutes: 90
        env:
          AMPIEZZA: ${{ github.event.inputs.scouting || 'scoperti' }}
        run: |
          set -euo pipefail
          # `scopri_fonti.py` senza `--temi` guarda TUTTI i temi: è il modo di
          # trovare i divulgatori di ogni argomento, non solo di quelli rimasti
          # orfani. Il cron mensile resta stretto apposta — ogni mese su tutto
          # sarebbe un'ora di rete per ritrovare le stesse.
          argomenti=(--da-nuvola)
          if [ "$AMPIEZZA" != "tutti" ]; then
            temi=$(python3 consegna_code/programma_fonti.py \
                     --temi-scoperti lavoro-fonti/salud.md)
            if [ -z "$temi" ]; then
              echo "Nessun tema scoperto: niente da cercare."
              exit 0
            fi
            echo "Temi senza fonti: $temi"
            argomenti+=(--temi "$temi")
          else
            echo "Scouting su tutti i temi, chiesto a mano."
          fi
          cd lavoro-fonti
          python3 ../consegna_code/scopri_fonti.py "${argomenti[@]}"
          cd ..
          # Le candidate entrano nella tabella SPENTE. Accenderle non è cosa di
          # questo passo: lo decide la verifica del lunedì dopo, che è l'unica
          # che le guarda davvero. Senza questa riga `proponer.json` resterebbe
          # un file, e la lista delle fonti smetterebbe di migliorare il giorno
          # in cui nessuno apre più il repository.
          python3 consegna_code/programma_fonti.py --proponi lavoro-fonti

      - name: Stato aggiornato nella release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -d lavoro-fonti ]; then
            echo "Nessuna cartella di lavoro: non ripubblico uno stato che non c'è."
            exit 0
          fi
          tar -cf stato-fonti.tar lavoro-fonti
          nota=$(printf '%s\n\n---\n\n%s\n' \
            "Verifica delle fonti del $(date -u '+%d/%m/%Y %H:%M') UTC." \
            "$(head -n 40 lavoro-fonti/salud.md 2>/dev/null || echo 'Nessun rapporto di salute.')")
          if gh release view fonti --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit fonti --repo "$GITHUB_REPOSITORY" --notes "$nota"
          else
            gh release create fonti --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Fonti — verifica settimanale" --notes "$nota"
          fi
          carica=(stato-fonti.tar)
          for f in lavoro-fonti/salud.md lavoro-fonti/informe.csv \
                   lavoro-fonti/activar.sql lavoro-fonti/proponer.sql; do
            if [ -f "$f" ]; then carica+=("$f"); fi
          done
          gh release upload fonti "${carica[@]}" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Riepilogo
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Fonti"
            echo ""
            echo '```'
            cat lavoro-fonti/salud.md 2>/dev/null || echo "Nessun salud.md: la verifica non è arrivata a scriverlo."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
